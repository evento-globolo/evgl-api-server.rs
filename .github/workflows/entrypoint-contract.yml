name: entrypoint-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  entrypoint-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify SOPS required-secret, literal-value, environment, exec, and Dockerfile argv contracts
        run: node --test scripts/sops-entrypoint.test.mjs
